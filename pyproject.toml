[build-system]
requires = ["flit_core>=3.9.0"]
build-backend = "flit_core.buildapi"

[project]
name = "sre-agent"
version = "0.1.0"
description = "Multi-agent SRE system for bank data platform (Flink, Databricks, EKS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk[litellm]>=1.0.0",
    "litellm>=1.30.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "slack-sdk>=3.30.0",
    "python-dotenv>=1.0.0",
    "opensearch-py>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "moto[cloudwatch,logs]>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
